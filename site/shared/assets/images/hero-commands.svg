<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%)">
  <defs>
    <linearGradient id="termGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal window background -->
  <rect x="200" y="150" width="1200" height="550" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Terminal header -->
  <rect x="200" y="150" width="1200" height="40" rx="12" fill="#1e293b"/>
  <circle cx="230" cy="170" r="6" fill="#ef4444"/>
  <circle cx="250" cy="170" r="6" fill="#f59e0b"/>
  <circle cx="270" cy="170" r="6" fill="#10b981"/>
  <text x="300" y="175" font-family="monospace" font-size="14" fill="#94a3b8">evolving-system</text>

  <!-- Command prompt lines -->
  <g font-family="'Courier New', monospace" font-size="18">
    <!-- Line 1 -->
    <text x="230" y="220" fill="#10b981">$</text>
    <text x="260" y="220" fill="#f97316">/explore</text>
    <text x="380" y="220" fill="#94a3b8">"how does delegation work?"</text>

    <!-- Line 2 -->
    <text x="230" y="260" fill="#64748b">→ Analyzing delegation system...</text>
    <text x="230" y="285" fill="#64748b">→ Found 3 related patterns</text>

    <!-- Line 3 -->
    <text x="230" y="335" fill="#10b981">$</text>
    <text x="260" y="335" fill="#8b5cf6">/create-agent</text>
    <text x="420" y="335" fill="#94a3b8">code-reviewer</text>

    <!-- Line 4 -->
    <text x="230" y="375" fill="#64748b">✓ Agent created: code-reviewer</text>
    <text x="230" y="400" fill="#64748b">✓ Registered in system</text>

    <!-- Line 5 -->
    <text x="230" y="450" fill="#10b981">$</text>
    <text x="260" y="450" fill="#f97316">/plan</text>
    <text x="340" y="450" fill="#94a3b8">"implement auth system"</text>

    <!-- Line 6 -->
    <text x="230" y="490" fill="#64748b">→ Generating execution plan...</text>
    <text x="230" y="515" fill="#64748b">→ 5 phases identified</text>
    <text x="230" y="540" fill="#64748b">→ 12 tasks created</text>

    <!-- Line 7 - current prompt -->
    <text x="230" y="590" fill="#10b981">$</text>
    <rect x="260" y="577" width="12" height="20" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Data flow visualization on the right -->
  <g transform="translate(1100, 250)">
    <!-- Flowing data streams -->
    <path d="M 0 0 Q 50 20 100 0" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 0 30 Q 50 50 100 30" stroke="#f97316" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 0 60 Q 50 80 100 60" stroke="#10b981" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 0 90 Q 50 110 100 90" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Data points -->
    <circle cx="25" cy="0" r="3" fill="#8b5cf6"/>
    <circle cx="75" cy="0" r="3" fill="#8b5cf6"/>
    <circle cx="50" cy="30" r="3" fill="#f97316"/>
    <circle cx="25" cy="60" r="3" fill="#10b981"/>
    <circle cx="75" cy="90" r="3" fill="#60a5fa"/>
  </g>

  <!-- Title -->
  <text x="800" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">
    Command-Line Interface
  </text>
  <text x="800" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#10b981" text-anchor="middle">
    63 Commands for AI-First Development
  </text>
</svg>
