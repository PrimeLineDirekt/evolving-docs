<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" style="background: linear-gradient(135deg, #18181b 0%, #27272a 100%)">
  <defs>
    <linearGradient id="hookGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ca8a04;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="hookGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.3" />
    </linearGradient>
    <pattern id="hookGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.5" fill="#eab308" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#hookGrid)"/>

  <!-- Event flow diagram -->
  <g transform="translate(250, 250)">
    <!-- Event source -->
    <rect width="180" height="80" rx="8" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="2"/>
    <text x="90" y="35" font-family="monospace" font-size="14" fill="#fde047" text-anchor="middle">
      EVENT
    </text>
    <text x="90" y="55" font-family="system-ui" font-size="12" fill="#facc15" text-anchor="middle">
      File Write
    </text>

    <!-- Hook symbol -->
    <path d="M 180 40 L 240 40" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#eab308" />
      </marker>
      <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#f97316" />
      </marker>
    </defs>
  </g>

  <!-- Hook processor -->
  <g transform="translate(510, 220)">
    <rect width="220" height="140" rx="8" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="2"/>
    <text x="110" y="30" font-family="monospace" font-size="15" font-weight="600" fill="#fb923c" text-anchor="middle">
      HOOK
    </text>
    <text x="110" y="55" font-family="monospace" font-size="13" fill="#fdba74" text-anchor="middle">
      check-comments.py
    </text>

    <!-- Processing indicator -->
    <rect x="40" y="75" width="140" height="4" rx="2" fill="#3f3f46"/>
    <rect x="40" y="75" width="90" height="4" rx="2" fill="url(#hookGrad2)"/>

    <text x="110" y="105" font-family="system-ui" font-size="11" fill="#a1a1aa" text-anchor="middle">
      Analyzing...
    </text>

    <!-- Hook outputs -->
    <path d="M 220 100 L 280 80" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <path d="M 220 150 L 280 170" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- Decision outputs -->
  <!-- Allow path -->
  <g transform="translate(810, 160)">
    <rect width="200" height="70" rx="8" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="30" font-family="monospace" font-size="14" fill="#4ade80" text-anchor="middle">
      ALLOW
    </text>
    <text x="100" y="50" font-family="system-ui" font-size="11" fill="#86efac" text-anchor="middle">
      Comments &lt; 25%
    </text>
    <circle cx="25" cy="35" r="8" fill="#22c55e" opacity="0.6"/>
  </g>

  <!-- Block path -->
  <g transform="translate(810, 280)">
    <rect width="200" height="70" rx="8" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="30" font-family="monospace" font-size="14" fill="#f87171" text-anchor="middle">
      BLOCK
    </text>
    <text x="100" y="50" font-family="system-ui" font-size="11" fill="#fca5a5" text-anchor="middle">
      Comments &gt; 25%
    </text>
    <circle cx="25" cy="35" r="8" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- Suggest path -->
  <g transform="translate(810, 400)">
    <rect width="200" height="70" rx="8" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="2"/>
    <text x="100" y="30" font-family="monospace" font-size="14" fill="#fde047" text-anchor="middle">
      SUGGEST
    </text>
    <text x="100" y="50" font-family="system-ui" font-size="11" fill="#fef08a" text-anchor="middle">
      Delegation hint
    </text>
    <circle cx="25" cy="35" r="8" fill="#eab308" opacity="0.6"/>
  </g>

  <!-- Hook types list -->
  <g transform="translate(1100, 200)">
    <rect width="360" height="320" rx="8" fill="rgba(39, 39, 42, 0.8)" stroke="#52525b" stroke-width="1.5"/>

    <text x="20" y="35" font-family="system-ui" font-size="16" font-weight="600" fill="#fafafa">
      Active Hooks
    </text>
    <line x1="20" y1="45" x2="340" y2="45" stroke="#52525b" stroke-width="1"/>

    <g font-family="monospace" font-size="12">
      <!-- Validation hooks -->
      <text x="20" y="75" fill="#eab308">▸</text>
      <text x="35" y="75" fill="#d4d4d8">check-comments.py</text>

      <text x="20" y="100" fill="#eab308">▸</text>
      <text x="35" y="100" fill="#d4d4d8">delegation-enforcer.py</text>

      <text x="20" y="125" fill="#eab308">▸</text>
      <text x="35" y="125" fill="#d4d4d8">todo-enforcer.sh</text>

      <!-- Sync hooks -->
      <line x1="20" y1="140" x2="340" y2="140" stroke="#3f3f46" stroke-width="1"/>

      <text x="20" y="165" fill="#f97316">▸</text>
      <text x="35" y="165" fill="#d4d4d8">auto-cross-reference.sh</text>

      <text x="20" y="190" fill="#f97316">▸</text>
      <text x="35" y="190" fill="#d4d4d8">knowledge-sync.sh</text>

      <!-- Analytics hooks -->
      <line x1="20" y1="205" x2="340" y2="205" stroke="#3f3f46" stroke-width="1"/>

      <text x="20" y="230" fill="#8b5cf6">▸</text>
      <text x="35" y="230" fill="#d4d4d8">usage-tracker.py</text>

      <text x="20" y="255" fill="#8b5cf6">▸</text>
      <text x="35" y="255" fill="#d4d4d8">session-summary.sh</text>
    </g>

    <line x1="20" y1="275" x2="340" y2="275" stroke="#52525b" stroke-width="1"/>
    <text x="20" y="300" font-family="system-ui" font-size="13" fill="#a1a1aa">
      7 hooks • 3 types
    </text>
  </g>

  <!-- Title -->
  <text x="800" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">
    System Hooks
  </text>
  <text x="800" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#eab308" text-anchor="middle">
    Event-Driven Quality Control
  </text>
</svg>
