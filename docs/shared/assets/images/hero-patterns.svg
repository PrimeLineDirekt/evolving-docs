<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)">
  <defs>
    <linearGradient id="patternGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="patternGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3" />
    </linearGradient>
    <pattern id="hexPattern" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 60,15 60,37 30,52 0,37 0,15" fill="none" stroke="rgba(139, 92, 246, 0.1)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#hexPattern)"/>

  <!-- Pattern cards arranged in a grid -->
  <!-- Row 1 -->
  <g transform="translate(200, 180)">
    <rect width="280" height="160" rx="12" fill="rgba(249, 115, 22, 0.12)" stroke="#f97316" stroke-width="2"/>
    <text x="20" y="35" font-family="monospace" font-size="16" font-weight="600" fill="#fb923c">reflection-pattern</text>
    <text x="20" y="65" font-family="system-ui" font-size="12" fill="#fdba74">Iterative improvement</text>
    <text x="20" y="85" font-family="system-ui" font-size="12" fill="#94a3b8">through self-critique</text>
    <!-- Pattern icon -->
    <circle cx="240" cy="120" r="20" fill="url(#patternGrad1)" opacity="0.4"/>
    <path d="M 240 110 L 250 120 L 240 130 L 230 120 Z" fill="#fb923c" opacity="0.8"/>
  </g>

  <g transform="translate(540, 180)">
    <rect width="280" height="160" rx="12" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="20" y="35" font-family="monospace" font-size="16" font-weight="600" fill="#a78bfa">react-pattern</text>
    <text x="20" y="65" font-family="system-ui" font-size="12" fill="#c4b5fd">Reasoning and acting</text>
    <text x="20" y="85" font-family="system-ui" font-size="12" fill="#94a3b8">in dynamic loops</text>
    <circle cx="240" cy="120" r="20" fill="url(#patternGrad2)" opacity="0.4"/>
    <path d="M 235 115 L 245 115 L 245 125 L 235 125 Z M 240 110 L 240 130" stroke="#a78bfa" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(880, 180)">
    <rect width="280" height="160" rx="12" fill="rgba(249, 115, 22, 0.12)" stroke="#f97316" stroke-width="2"/>
    <text x="20" y="35" font-family="monospace" font-size="16" font-weight="600" fill="#fb923c">delegation-pattern</text>
    <text x="20" y="65" font-family="system-ui" font-size="12" fill="#fdba74">Multi-agent task</text>
    <text x="20" y="85" font-family="system-ui" font-size="12" fill="#94a3b8">distribution</text>
    <circle cx="240" cy="120" r="20" fill="url(#patternGrad1)" opacity="0.4"/>
    <circle cx="230" cy="115" r="3" fill="#fb923c"/>
    <circle cx="240" cy="120" r="3" fill="#fb923c"/>
    <circle cx="250" cy="125" r="3" fill="#fb923c"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(200, 400)">
    <rect width="280" height="160" rx="12" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="20" y="35" font-family="monospace" font-size="16" font-weight="600" fill="#a78bfa">tree-of-thoughts</text>
    <text x="20" y="65" font-family="system-ui" font-size="12" fill="#c4b5fd">Explore multiple</text>
    <text x="20" y="85" font-family="system-ui" font-size="12" fill="#94a3b8">solution paths</text>
    <circle cx="240" cy="120" r="20" fill="url(#patternGrad2)" opacity="0.4"/>
    <line x1="240" y1="110" x2="230" y2="125" stroke="#a78bfa" stroke-width="2"/>
    <line x1="240" y1="110" x2="250" y2="125" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <g transform="translate(540, 400)">
    <rect width="280" height="160" rx="12" fill="rgba(249, 115, 22, 0.12)" stroke="#f97316" stroke-width="2"/>
    <text x="20" y="35" font-family="monospace" font-size="16" font-weight="600" fill="#fb923c">context-aware</text>
    <text x="20" y="65" font-family="system-ui" font-size="12" fill="#fdba74">Dynamic context</text>
    <text x="20" y="85" font-family="system-ui" font-size="12" fill="#94a3b8">management</text>
    <circle cx="240" cy="120" r="20" fill="url(#patternGrad1)" opacity="0.4"/>
    <rect x="230" y="110" width="20" height="20" rx="3" fill="none" stroke="#fb923c" stroke-width="2"/>
  </g>

  <g transform="translate(880, 400)">
    <rect width="280" height="160" rx="12" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="20" y="35" font-family="monospace" font-size="16" font-weight="600" fill="#a78bfa">staged-learning</text>
    <text x="20" y="65" font-family="system-ui" font-size="12" fill="#c4b5fd">Progressive rule</text>
    <text x="20" y="85" font-family="system-ui" font-size="12" fill="#94a3b8">validation</text>
    <circle cx="240" cy="120" r="20" fill="url(#patternGrad2)" opacity="0.4"/>
    <path d="M 230 115 L 240 120 L 250 115" stroke="#a78bfa" stroke-width="2" fill="none"/>
  </g>

  <!-- Connection lines showing pattern relationships -->
  <path d="M 480 260 L 540 260" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <path d="M 820 260 L 880 260" stroke="#f97316" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <path d="M 340 340 L 340 400" stroke="#f97316" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <path d="M 680 340 L 680 400" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Title -->
  <text x="800" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">
    Reasoning Patterns
  </text>
  <text x="800" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#fb923c" text-anchor="middle">
    Advanced AI Reasoning Techniques
  </text>
</svg>
