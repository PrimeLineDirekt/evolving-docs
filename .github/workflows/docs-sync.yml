# Documentation Sync Workflow
# Runs weekly (Sunday 02:00 UTC) and on manual trigger
# Generates docs from evolving source repo, builds, and commits to this repo

name: Documentation Sync

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all docs (ignore cache)'
        required: false
        default: 'false'
        type: boolean
      skip_infographics:
        description: 'Skip infographic generation'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.12'

jobs:
  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout evolving source
        uses: actions/checkout@v4
        with:
          repository: PrimeLineDirekt/evolving
          path: _source/evolving
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache generated docs
        uses: actions/cache@v4
        with:
          path: |
            docs/en/components
            docs/de/components
            docs/shared/assets/infographics
          key: docs-${{ hashFiles('_source/evolving/_stats.json', '_source/evolving/_graph/**/*.json', '_source/evolving/.claude/**/*.md') }}
          restore-keys: |
            docs-

      - name: Generate documentation
        env:
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}
          EVOLVING_ROOT: ${{ github.workspace }}/_source/evolving
          DOCS_ROOT: ${{ github.workspace }}
        run: |
          if [ "$FORCE_REGENERATE" = "true" ]; then
            python docs-generator/cli.py --force --source "$EVOLVING_ROOT" --output "$DOCS_ROOT"
          else
            python docs-generator/cli.py --source "$EVOLVING_ROOT" --output "$DOCS_ROOT"
          fi

      - name: Build documentation
        run: mkdocs build --strict

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/ || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated docs
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          COMMIT_DATE=$(date +%Y-%m-%d)
          git commit -m "docs: Auto-sync documentation ${COMMIT_DATE}"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  build-check:
    name: Validate Build
    runs-on: ubuntu-latest
    needs: generate-docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with strict mode
        run: mkdocs build --strict

      - name: Check link integrity
        run: |
          EN_COUNT=$(find docs/en -name "*.md" | wc -l)
          DE_COUNT=$(find docs/de -name "*.md" | wc -l)

          echo "English docs: $EN_COUNT"
          echo "German docs: $DE_COUNT"

          DIFF=$((EN_COUNT - DE_COUNT))
          DIFF=${DIFF#-}

          if [ "$DIFF" -gt 5 ]; then
            echo "::warning::Language parity issue: EN=$EN_COUNT, DE=$DE_COUNT (diff=$DIFF)"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [generate-docs, build-check]
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Documentation sync failed - ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Documentation Sync Failure',
              '',
              'The weekly documentation sync workflow has failed.',
              '',
              `**Workflow Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `**Triggered by:** ${context.eventName}`,
              '',
              'Please investigate and fix the issue.',
              '',
              '### Possible causes:',
              '- Source file parsing errors (evolving repo)',
              '- Missing dependencies',
              '- API rate limits (fal.ai)',
              '- MkDocs build errors',
              '',
              '/cc @neoforce'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['documentation', 'automated', 'bug']
            });
